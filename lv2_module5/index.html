<!DOCTYPE html>
<!--
  추적 모니터 (웹 GUI)
  rosbridge(ws://<host>:9090)로 붙어 실기·가상환경 토픽을 같은 화면에 보여 준다.
    가상환경:  ros2 launch cognitive_control sim.launch.py
    실기:      (실기 노드 실행 중) ros2 launch cognitive_control sim.launch.py use_sim:=false use_tracker:=false
  주소 뒤에 ?ws=ws://192.168.0.10:9090 을 붙이면 다른 PC의 rosbridge에 붙는다.
-->
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>추적 모니터</title>
<script src="https://cdn.jsdelivr.net/npm/roslib@1.4.1/build/roslib.min.js"></script>
<style>
  :root {
    --bg: #f4f5f7; --panel: #ffffff; --border: #dde0e5; --text: #1d2129; --muted: #69707d;
    --accent: #2f6fdb; --ok: #1f9d55; --warn: #d98e04; --bad: #d64545; --idle: #7a828f;
    --grid: #eceef2; --pan: #2f6fdb; --tilt: #c2410c;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #14161a; --panel: #1d2026; --border: #2e323a; --text: #e6e8ec; --muted: #9aa1ad;
      --accent: #6c9cf0; --ok: #3ccf7f; --warn: #f2b32e; --bad: #f06a6a; --idle: #8b93a1;
      --grid: #262a31; --pan: #6c9cf0; --tilt: #f0915a;
    }
  }
  :root[data-theme="dark"] {
    --bg: #14161a; --panel: #1d2026; --border: #2e323a; --text: #e6e8ec; --muted: #9aa1ad;
    --accent: #6c9cf0; --ok: #3ccf7f; --warn: #f2b32e; --bad: #f06a6a; --idle: #8b93a1;
    --grid: #262a31; --pan: #6c9cf0; --tilt: #f0915a;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 14px/1.45 system-ui, -apple-system, "Noto Sans KR", sans-serif; }
  header { display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
           padding: 12px 16px; border-bottom: 1px solid var(--border); background: var(--panel); }
  header h1 { font-size: 16px; margin: 0 8px 0 0; }
  header input { flex: 1 1 220px; min-width: 0; padding: 6px 8px; border: 1px solid var(--border);
                 border-radius: 6px; background: var(--bg); color: var(--text); font: inherit; }
  button { padding: 6px 12px; border: 1px solid var(--border); border-radius: 6px;
           background: var(--bg); color: var(--text); font: inherit; cursor: pointer; }
  button:hover { border-color: var(--accent); }
  .conn { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--idle); }
  .dot.on { background: var(--ok); } .dot.err { background: var(--bad); }
  main { display: grid; gap: 12px; padding: 12px 16px;
         grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); }
  @media (max-width: 860px) { main { grid-template-columns: minmax(0, 1fr); } }
  .col { display: grid; gap: 12px; align-content: start; }
  section { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 12px; }
  section h2 { font-size: 13px; font-weight: 600; margin: 0 0 8px; color: var(--muted);
               display: flex; justify-content: space-between; gap: 8px; }
  section h2 code { font-weight: 400; }
  .frame { position: relative; aspect-ratio: 4 / 3; background: var(--grid); border-radius: 6px; overflow: hidden; }
  .frame img { width: 100%; height: 100%; object-fit: contain; display: block; }
  .frame .empty { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); }
  .two { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; }
  @media (max-width: 520px) { .two { grid-template-columns: minmax(0, 1fr); } }
  .status { font-size: 28px; font-weight: 700; letter-spacing: .02em; padding: 10px; text-align: center;
            border-radius: 6px; color: #fff; background: var(--idle); }
  .status.TRACKING { background: var(--ok); } .status.LOST { background: var(--bad); }
  .kv { display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; margin-top: 8px;
        font-variant-numeric: tabular-nums; }
  .kv dt { color: var(--muted); } .kv dd { margin: 0; text-align: right; }
  canvas { width: 100%; display: block; }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  td { padding: 3px 0; border-top: 1px solid var(--border); }
  td:last-child, td:nth-child(2) { text-align: right; color: var(--muted); }
  .stale { color: var(--bad) !important; }
  code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }
  .legend { display: flex; gap: 12px; font-size: 12px; color: var(--muted); }
  .legend i { display: inline-block; width: 10px; height: 3px; vertical-align: middle; margin-right: 4px; }
</style>
</head>
<body>
<header>
  <h1>추적 모니터</h1>
  <input id="url" aria-label="rosbridge 주소">
  <button id="connect">연결</button>
  <span class="conn"><span id="dot" class="dot"></span><span id="connText">연결 안 됨</span></span>
</header>

<main>
  <div class="col">
    <section>
      <h2>디버그 영상 <code>/perception_node/debug_image/compressed</code></h2>
      <div class="frame"><img id="debugImg" alt=""><div class="empty" id="debugEmpty">영상 없음</div></div>
    </section>
    <section>
      <h2>목표 오차 (최근 20초) <span class="legend"><span><i style="background:var(--pan)"></i>ex</span><span><i style="background:var(--tilt)"></i>ey</span></span></h2>
      <canvas id="chart" height="160"></canvas>
    </section>
  </div>

  <div class="col">
    <section>
      <h2>추적 상태 <code>/tracking_status</code></h2>
      <div id="status" class="status">—</div>
      <dl class="kv"><dt>마지막 수신</dt><dd id="statusAge">—</dd></dl>
    </section>
    <section>
      <h2>목표 <code>/target</code></h2>
      <canvas id="targetPlot" height="200"></canvas>
      <dl class="kv">
        <dt>ex</dt><dd id="ex">—</dd>
        <dt>ey</dt><dd id="ey">—</dd>
        <dt>면적 비율</dt><dd id="area">—</dd>
      </dl>
    </section>
    <section>
      <h2>모터 누적각 <code>/motor_cmd</code></h2>
      <canvas id="dials" height="130"></canvas>
      <dl class="kv">
        <dt>마지막 Δpan, Δtilt</dt><dd id="lastCmd">—</dd>
        <dt>명령 수</dt><dd id="cmdCount">0</dd>
      </dl>
      <button id="resetMotor" style="margin-top:8px">0으로 맞추기</button>
    </section>
    <section>
      <h2>마스크 <code>/perception_node/mask/compressed</code></h2>
      <div class="frame"><img id="maskImg" alt=""><div class="empty" id="maskEmpty">영상 없음</div></div>
    </section>
    <section>
      <h2>토픽 수신</h2>
      <table id="topics"></table>
    </section>
  </div>
</main>

<script>
const TOPICS = {
  debug:  { name: '/perception_node/debug_image/compressed', type: 'sensor_msgs/msg/CompressedImage', throttle: 100 },
  mask:   { name: '/perception_node/mask/compressed',        type: 'sensor_msgs/msg/CompressedImage', throttle: 200 },
  target: { name: '/target',          type: 'geometry_msgs/msg/PointStamped' },
  status: { name: '/tracking_status', type: 'std_msgs/msg/String' },
  motor:  { name: '/motor_cmd',       type: 'sensor_msgs/msg/JointState' },
};
const STALE_MS = 2000, DEADBAND = 0.05, HISTORY_MS = 20000;
const $ = id => document.getElementById(id);
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();

const params = new URLSearchParams(location.search);
$('url').value = params.get('ws') || `ws://${location.hostname || 'localhost'}:9090`;

const stats = {};       // 토픽별 {count, last, times[]}
const history = [];     // {t, ex, ey, ok}
let target = null, pan = 0, tilt = 0, cmdCount = 0, ros = null, subs = [];

function mark(key) {
  const s = stats[key] || (stats[key] = { count: 0, last: 0, times: [] });
  const now = performance.now();
  s.count++; s.last = now; s.times.push(now);
  while (s.times.length && now - s.times[0] > 3000) s.times.shift();
}

function setConn(state, text) {
  $('dot').className = 'dot' + (state === 'on' ? ' on' : state === 'err' ? ' err' : '');
  $('connText').textContent = text;
}

function connect() {
  if (typeof ROSLIB === 'undefined') { setConn('err', 'roslib 로드 실패 (인터넷 연결 확인)'); return; }
  subs.forEach(s => s.unsubscribe()); subs = [];
  if (ros) ros.close();
  const url = $('url').value.trim();
  setConn('', '연결 중…');
  ros = new ROSLIB.Ros({ url });
  ros.on('connection', () => { setConn('on', '연결됨'); subscribe(); });
  ros.on('error', () => setConn('err', `연결 실패: ${url} (rosbridge 실행 확인)`));
  ros.on('close', () => { if ($('dot').className.includes('on')) setConn('err', '연결 끊김'); });
}

function sub(key, cb) {
  const t = TOPICS[key];
  const topic = new ROSLIB.Topic({ ros, name: t.name, messageType: t.type,
                                   throttle_rate: t.throttle || 0, queue_length: 1 });
  topic.subscribe(msg => { mark(key); cb(msg); });
  subs.push(topic);
}

function showImage(imgId, emptyId, msg) {
  const fmt = (msg.format || 'jpeg').includes('png') ? 'png' : 'jpeg';
  $(imgId).src = `data:image/${fmt};base64,${msg.data}`;
  $(emptyId).style.display = 'none';
}

function subscribe() {
  sub('debug', m => showImage('debugImg', 'debugEmpty', m));
  sub('mask',  m => showImage('maskImg', 'maskEmpty', m));
  sub('target', m => {
    const p = m.point, ok = p.z > 0;
    target = { ex: p.x, ey: p.y, area: p.z, ok };
    history.push({ t: performance.now(), ex: p.x, ey: p.y, ok });
    $('ex').textContent = ok ? p.x.toFixed(3) : '—';
    $('ey').textContent = ok ? p.y.toFixed(3) : '—';
    $('area').textContent = ok ? (p.z * 100).toFixed(2) + ' %' : '미검출';
  });
  sub('status', m => { const el = $('status'); el.textContent = m.data; el.className = 'status ' + m.data; });
  sub('motor', m => {
    if (m.position.length < 2) return;
    pan += m.position[0]; tilt += m.position[1]; cmdCount++;
    $('lastCmd').textContent = `${deg(m.position[0])}°, ${deg(m.position[1])}°`;
    $('cmdCount').textContent = cmdCount;
  });
}

const deg = r => (r * 180 / Math.PI).toFixed(2);

function fitCanvas(c) {
  const dpr = window.devicePixelRatio || 1, w = c.clientWidth, h = +c.getAttribute('height');
  if (c.width !== Math.round(w * dpr)) { c.width = Math.round(w * dpr); c.height = Math.round(h * dpr); }
  c.style.height = h + 'px';
  const ctx = c.getContext('2d'); ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  return [ctx, w, h];
}

function drawTarget() {
  const [ctx, w, h] = fitCanvas($('targetPlot'));
  const s = Math.min(w, h) - 8, x0 = (w - s) / 2, y0 = (h - s) / 2;
  ctx.clearRect(0, 0, w, h);
  ctx.fillStyle = css('--grid'); ctx.fillRect(x0, y0, s, s);
  ctx.strokeStyle = css('--border'); ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(x0 + s / 2, y0); ctx.lineTo(x0 + s / 2, y0 + s);
  ctx.moveTo(x0, y0 + s / 2); ctx.lineTo(x0 + s, y0 + s / 2); ctx.stroke();
  const d = DEADBAND * s / 2;
  ctx.setLineDash([3, 3]); ctx.strokeStyle = css('--muted');
  ctx.strokeRect(x0 + s / 2 - d, y0 + s / 2 - d, 2 * d, 2 * d); ctx.setLineDash([]);
  if (target && target.ok) {
    const px = x0 + (target.ex + 1) / 2 * s, py = y0 + (target.ey + 1) / 2 * s;
    ctx.fillStyle = css('--accent');
    ctx.beginPath(); ctx.arc(px, py, 6, 0, 2 * Math.PI); ctx.fill();
  } else {
    ctx.fillStyle = css('--muted'); ctx.textAlign = 'center'; ctx.font = '13px system-ui';
    ctx.fillText(target ? '미검출' : '수신 없음', w / 2, h / 2 - 8);
  }
}

function drawDial(ctx, cx, cy, r, angle, label, color) {
  ctx.strokeStyle = css('--border'); ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(cx, cy, r, 0, 2 * Math.PI); ctx.stroke();
  ctx.strokeStyle = color; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(cx, cy);
  ctx.lineTo(cx + r * Math.sin(angle), cy - r * Math.cos(angle)); ctx.stroke();
  ctx.fillStyle = css('--text'); ctx.textAlign = 'center'; ctx.font = '600 13px system-ui';
  ctx.fillText(`${label} ${deg(angle)}°`, cx, cy + r + 18);
}

function drawDials() {
  const [ctx, w, h] = fitCanvas($('dials'));
  ctx.clearRect(0, 0, w, h);
  const r = Math.min(w / 4 - 10, h / 2 - 20);
  // pan +는 왼쪽 회전이라 다이얼에서는 반시계로 그린다
  drawDial(ctx, w / 4, r + 6, r, -pan, 'pan', css('--pan'));
  drawDial(ctx, 3 * w / 4, r + 6, r, tilt, 'tilt', css('--tilt'));
}

function drawChart() {
  const [ctx, w, h] = fitCanvas($('chart'));
  const now = performance.now();
  while (history.length && now - history[0].t > HISTORY_MS) history.shift();
  ctx.clearRect(0, 0, w, h);
  const pad = 26, y = v => h / 2 - v * (h / 2 - 8), x = t => pad + (1 - (now - t) / HISTORY_MS) * (w - pad);
  ctx.strokeStyle = css('--grid'); ctx.lineWidth = 1; ctx.fillStyle = css('--muted');
  ctx.font = '11px system-ui'; ctx.textAlign = 'right';
  for (const v of [1, 0.5, 0, -0.5, -1]) {
    ctx.beginPath(); ctx.moveTo(pad, y(v)); ctx.lineTo(w, y(v)); ctx.stroke();
    ctx.fillText(v.toFixed(1), pad - 4, y(v) + 4);
  }
  for (const [key, color] of [['ex', css('--pan')], ['ey', css('--tilt')]]) {
    ctx.strokeStyle = color; ctx.lineWidth = 2; ctx.beginPath();
    let pen = false;
    for (const p of history) {
      if (!p.ok) { pen = false; continue; }
      pen ? ctx.lineTo(x(p.t), y(p[key])) : ctx.moveTo(x(p.t), y(p[key]));
      pen = true;
    }
    ctx.stroke();
  }
}

function drawTopics() {
  const now = performance.now();
  $('topics').innerHTML = Object.entries(TOPICS).map(([key, t]) => {
    const s = stats[key], age = s ? now - s.last : Infinity;
    const hz = s ? (s.times.length / 3).toFixed(1) + ' Hz' : '—';
    return `<tr><td><code>${t.name}</code></td><td class="${age > STALE_MS ? 'stale' : ''}">${hz}</td></tr>`;
  }).join('');
  const st = stats.status;
  $('statusAge').textContent = st ? ((now - st.last) / 1000).toFixed(1) + '초 전' : '—';
  $('statusAge').className = st && now - st.last > STALE_MS ? 'stale' : '';
}

function frame() { drawTarget(); drawDials(); drawChart(); drawTopics(); requestAnimationFrame(frame); }

$('connect').onclick = connect;
$('url').onkeydown = e => { if (e.key === 'Enter') connect(); };
$('resetMotor').onclick = () => { pan = 0; tilt = 0; };
requestAnimationFrame(frame);
connect();
</script>
</body>
</html>
