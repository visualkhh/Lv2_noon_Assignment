  <style>
    :root {
      --bg: #101018;
      --surface: #1a1a26;
      --surface2: #222233;
      --border: #2e2e44;
      --text: #e8e8f0;
      --muted: #9a9ab0;
      --brand: #6a7cff;
      --brand-dim: rgba(106, 124, 255, 0.16);
      --green: #34d17b;

      --red: #ff5d5d;
      --red-dim: rgba(255, 93, 93, 0.14);

    }
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; padding: 0; background: var(--bg); color: var(--text); font-family: var(--font-sans); }
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-thumb { background: #3a3a55; border-radius: 4px; }
